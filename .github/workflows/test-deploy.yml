name: Deploy to Development EC2

on:
  push:
    branches:
      - develop
env:
  name: myce

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v5.0.0

      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with gradle
        run: ./gradlew clean build -x test

      - name: Login to Docker
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.name }}:latest

      - name: Start app via ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TARGET_HOST }}
          username: ${{ secrets.TARGET_USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_port: ${{ secrets.PROXY_PORT }}
          proxy_host: ${{ secrets.PROXY_HOST }}
          proxy_username: ${{ secrets.PROXY_USER_NAME }}
          proxy_key: "${{ secrets.SSH_PRIVATE_KEY }}"
          script: |
            cd /home/${{ secrets.TARGET_USER_NAME }}/app/myce/ && \
            sudo docker-compose stop || true && \
            sudo docker-compose rm -f || true && \
            sudo docker rmi ${{ secrets.DOCKER_USERNAME }}/${{ env.name }}:latest || true && \
            sudo docker-compose up -d && \
            echo "✅ Restart completed at $(date)"